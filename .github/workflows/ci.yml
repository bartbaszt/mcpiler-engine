name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request range
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::Commit $sha is missing 'Signed-off-by: $author'"
              missing=1
            fi
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")
          if [ "$missing" -ne 0 ]; then
            echo "Use 'git commit -s' (see CONTRIBUTING.md)." >&2
            exit 1
          fi
          echo "All commits carry a matching DCO sign-off."

  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Verify source
        env:
          CI: 'true'
        run: bash eng/verify-source.sh

      # The deterministic metadata, licence and release-helper gates used to run only in the release
      # workflow. A defect in any of them (for example a guard that cannot pass on Linux because
      # eng/*.sh lost its executable bit) could therefore stay latent until the first stable release,
      # when it is expensive and disruptive. Run them on every push/PR so ordinary CI is the first
      # place such a defect appears.
      - name: Verify release metadata, licences and release helpers
        run: |
          set -euo pipefail
          bash eng/check-release-metadata.sh
          bash eng/check-licenses.sh
          bash eng/test-release-helpers.sh
