name: Secret scanning

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  betterleaks:
    name: BetterLeaks (full Git history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete Engine history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified BetterLeaks 1.9.0
        shell: bash
        run: |
          set -euo pipefail
          archive=betterleaks_1.9.0_linux_x64.tar.gz
          curl --fail --silent --show-error --location \
            "https://github.com/betterleaks/betterleaks/releases/download/v1.9.0/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          echo "f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7  ${RUNNER_TEMP}/${archive}" | sha256sum --check --status
          mkdir -p "${RUNNER_TEMP}/betterleaks-bin"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/betterleaks-bin"
          binary="$(find "${RUNNER_TEMP}/betterleaks-bin" -type f -name betterleaks -print -quit)"
          test -n "${binary}"
          chmod +x "${binary}"
          echo "$(dirname "${binary}")" >> "${GITHUB_PATH}"

      - name: Scan all Engine commits
        shell: bash
        run: bash eng/check-secrets.sh --history
