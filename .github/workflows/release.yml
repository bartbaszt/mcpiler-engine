name: Reusable stable release

on:
  workflow_call:
    inputs:
      bump:
        description: Stable SemVer bump selected by the explicit entry workflow.
        required: true
        type: string

concurrency:
  group: engine-stable-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source_verify:
    name: PRECHECK / SOURCE_VERIFIED
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Verify standalone source, metadata, licences and release helpers
        run: |
          set -euo pipefail
          bash eng/verify-source.sh
          bash eng/check-release-metadata.sh
          bash eng/check-licenses.sh
          bash eng/test-release-helpers.sh

  prepare:
    name: METADATA_PREPARED / RELEASE_COMMITTED
    needs: source_verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      release_version: ${{ steps.prepare.outputs.release_version }}
      release_tag: ${{ steps.prepare.outputs.release_tag }}
      release_commit: ${{ steps.prepare.outputs.release_commit }}
      release_bundle: ${{ steps.bundle.outputs.release_bundle }}
      release_bundle_sha256: ${{ steps.bundle.outputs.release_bundle_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          # The prepared metadata must be checked against the live remote: eng/release.sh --prepare
          # runs the origin-race check and the immutable-tag check, and this repository is private.
          # Credentials are retained for read only - the job holds contents: read and never pushes.
          persist-credentials: true
      - name: Prepare immutable release commit
        id: prepare
        env:
          BUMP: ${{ inputs.bump }}
          MCPILER_ENGINE_RELEASE_WORKFLOW: 'true'
        run: |
          set -euo pipefail
          output="$(bash eng/release.sh --prepare --bump "$BUMP")"
          printf '%s\n' "$output"
          # Capture each value before writing it: a failing command substitution in argument position
          # does not trigger errexit, so an inline "$(...)" could silently publish an empty output.
          base_sha="$(printf '%s\n' "$output" | sed -n 's/^BASE_SHA=//p')"
          release_version="$(printf '%s\n' "$output" | sed -n 's/^RELEASE_VERSION=//p')"
          release_tag="$(printf '%s\n' "$output" | sed -n 's/^RELEASE_TAG=//p')"
          release_commit="$(printf '%s\n' "$output" | sed -n 's/^RELEASE_COMMIT=//p')"
          [[ -n "$base_sha" && -n "$release_version" && -n "$release_tag" && -n "$release_commit" ]] || {
            echo 'FAIL: eng/release.sh --prepare did not report complete release metadata.' >&2
            exit 1
          }
          printf 'base_sha=%s\n' "$base_sha" >>"$GITHUB_OUTPUT"
          printf 'release_version=%s\n' "$release_version" >>"$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$release_tag" >>"$GITHUB_OUTPUT"
          printf 'release_commit=%s\n' "$release_commit" >>"$GITHUB_OUTPUT"
      - name: Package the prepared commit without publishing Git refs
        id: bundle
        env:
          BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
          RELEASE_COMMIT: ${{ steps.prepare.outputs.release_commit }}
        run: |
          set -euo pipefail
          # GitHub Actions artifact storage is unavailable for this account, so the prepared commit
          # travels as a base64 job output (same run) and as a marked log block (resume of a run that
          # already failed). The bundle is incremental over base_sha and carries exactly one head,
          # refs/heads/main, at the release commit; it publishes no Git ref and needs no write scope.
          # The helper's shared PAYLOAD_MAX_ENCODED_BYTES cap keeps the payload below the Linux
          # single-environment-string limit, so an oversized bundle fails here, not at consumer start.
          output="$(bash eng/release-bundle.sh write --repo . --bundle release.bundle --base-sha "$BASE_SHA" --release-commit "$RELEASE_COMMIT")"
          printf '%s\n' "$output"
          sha256="$(printf '%s\n' "$output" | sed -n 's/^RELEASE_BUNDLE_SHA256=//p')"
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]] || { echo 'FAIL: release bundle digest is missing or malformed.' >&2; exit 1; }
          bundle_base64="$(bash eng/release-bundle.sh encode --bundle release.bundle)"
          printf 'release_bundle=%s\n' "$bundle_base64" >>"$GITHUB_OUTPUT"
          printf 'release_bundle_sha256=%s\n' "$sha256" >>"$GITHUB_OUTPUT"
          # A failed run exposes neither artifacts nor job outputs to a later run, so the resume
          # workflow reads this block back from the prepare job log and authenticates it by SHA-256.
          bash eng/release-bundle.sh print-log --bundle release.bundle --release-commit "$RELEASE_COMMIT" --sha256 "$sha256"

  candidate_publish:
    name: CANDIDATE_PUBLISHED
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      candidate_ref: ${{ steps.publish.outputs.candidate_ref }}
      candidate_digest: ${{ steps.publish.outputs.candidate_digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Restore prepared source
        working-directory: source
        env:
          RELEASE_BUNDLE: ${{ needs.prepare.outputs.release_bundle }}
          RELEASE_BUNDLE_SHA256: ${{ needs.prepare.outputs.release_bundle_sha256 }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_BUNDLE" | bash eng/release-bundle.sh restore --repo . --base64-stdin --sha256 "$RELEASE_BUNDLE_SHA256" --base-sha "$BASE_SHA" --release-commit "$RELEASE_COMMIT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push one immutable two-platform candidate
        id: publish
        working-directory: source
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit }}
          MCPILER_ENGINE_RELEASE_WORKFLOW: 'true'
        run: |
          set -euo pipefail
          # Candidate build contract: linux/amd64,linux/arm64; provenance: false; sbom: false.
          output="$(bash eng/publish-release.sh --candidate --sha "$RELEASE_COMMIT")"
          printf '%s\n' "$output"
          candidate_ref="$(printf '%s\n' "$output" | sed -n 's/^CANDIDATE_REF=//p')"
          candidate_digest="$(printf '%s\n' "$output" | sed -n 's/^CANDIDATE_DIGEST=//p')"
          printf 'candidate_ref=%s\n' "$candidate_ref" >>"$GITHUB_OUTPUT"
          printf 'candidate_digest=%s\n' "$candidate_digest" >>"$GITHUB_OUTPUT"

  smoke_amd64:
    name: CANDIDATE_SMOKED linux/amd64
    needs: [prepare, candidate_publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Restore prepared source
        working-directory: source
        env:
          RELEASE_BUNDLE: ${{ needs.prepare.outputs.release_bundle }}
          RELEASE_BUNDLE_SHA256: ${{ needs.prepare.outputs.release_bundle_sha256 }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_BUNDLE" | bash eng/release-bundle.sh restore --repo . --base64-stdin --sha256 "$RELEASE_BUNDLE_SHA256" --base-sha "$BASE_SHA" --release-commit "$RELEASE_COMMIT"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Native amd64 smoke
        working-directory: source
        run: bash eng/verify-container.sh --image '${{ needs.candidate_publish.outputs.candidate_ref }}' --version '${{ needs.prepare.outputs.release_version }}' --revision '${{ needs.prepare.outputs.release_commit }}' --runtime-only

  smoke_arm64:
    name: CANDIDATE_SMOKED linux/arm64
    needs: [prepare, candidate_publish]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Restore prepared source
        working-directory: source
        env:
          RELEASE_BUNDLE: ${{ needs.prepare.outputs.release_bundle }}
          RELEASE_BUNDLE_SHA256: ${{ needs.prepare.outputs.release_bundle_sha256 }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_BUNDLE" | bash eng/release-bundle.sh restore --repo . --base64-stdin --sha256 "$RELEASE_BUNDLE_SHA256" --base-sha "$BASE_SHA" --release-commit "$RELEASE_COMMIT"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Native arm64 smoke
        working-directory: source
        run: bash eng/verify-container.sh --image '${{ needs.candidate_publish.outputs.candidate_ref }}' --version '${{ needs.prepare.outputs.release_version }}' --revision '${{ needs.prepare.outputs.release_commit }}' --runtime-only

  sbom:
    name: Generate candidate SBOM
    needs: [prepare, smoke_amd64, smoke_arm64, candidate_publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      sbom_gz_base64: ${{ steps.encode.outputs.sbom_gz_base64 }}
      sbom_sha256: ${{ steps.encode.outputs.sbom_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/bartbaszt/mcpiler-engine@${{ needs.candidate_publish.outputs.candidate_digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          format: spdx-json
          output-file: sbom.spdx.json
          syft-version: v1.52.0
          upload-artifact: false
          upload-release-assets: false
      - name: Encode the SBOM for the supply-chain job without artifact storage
        id: encode
        run: |
          set -euo pipefail
          # gzip -9n drops the name and mtime fields, so the encoded payload is a deterministic
          # function of the SBOM bytes; the SHA-256 is taken over the uncompressed JSON.
          output="$(bash source/eng/release-bundle.sh sbom-encode --input sbom.spdx.json --output sbom.spdx.json.gz.b64)"
          printf '%s\n' "$output"
          sha256="$(printf '%s\n' "$output" | sed -n 's/^SBOM_SHA256=//p')"
          printf 'sbom_sha256=%s\n' "$sha256" >>"$GITHUB_OUTPUT"
          sbom_base64="$(tr -d '\n' < sbom.spdx.json.gz.b64)"
          printf 'sbom_gz_base64=%s\n' "$sbom_base64" >>"$GITHUB_OUTPUT"

  supply_chain:
    name: SUPPLY_CHAIN_VERIFIED
    needs: [prepare, candidate_publish, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Restore prepared source
        working-directory: source
        env:
          RELEASE_BUNDLE: ${{ needs.prepare.outputs.release_bundle }}
          RELEASE_BUNDLE_SHA256: ${{ needs.prepare.outputs.release_bundle_sha256 }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_BUNDLE" | bash eng/release-bundle.sh restore --repo . --base64-stdin --sha256 "$RELEASE_BUNDLE_SHA256" --base-sha "$BASE_SHA" --release-commit "$RELEASE_COMMIT"
      - name: Restore the verified SBOM without artifact storage
        env:
          SBOM_GZ_BASE64: ${{ needs.sbom.outputs.sbom_gz_base64 }}
          SBOM_SHA256: ${{ needs.sbom.outputs.sbom_sha256 }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SBOM_GZ_BASE64" > sbom.spdx.json.gz.b64
          bash source/eng/release-bundle.sh sbom-restore --input sbom.spdx.json.gz.b64 --output sbom.spdx.json --sha256 "$SBOM_SHA256"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with:
          cosign-release: v2.6.0
      - name: Sign and attach SBOM and SLSA provenance by digest
        working-directory: source
        env:
          SUBJECT: ghcr.io/bartbaszt/mcpiler-engine@${{ needs.candidate_publish.outputs.candidate_digest }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          INVOCATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cp ../sbom.spdx.json ./sbom.spdx.json
          python - <<'PY'
          import json, os
          data = {
              "buildDefinition": {
                  "buildType": "https://slsa.dev/container-based-build/v1",
                  "externalParameters": {
                      "repository": "https://github.com/bartbaszt/mcpiler-engine",
                      "version": os.environ["RELEASE_VERSION"],
                  },
                  "internalParameters": {
                      "workflow": ".github/workflows/release.yml",
                  },
                  "resolvedDependencies": [{
                      "uri": "git+https://github.com/bartbaszt/mcpiler-engine",
                      "digest": {"gitCommit": os.environ["RELEASE_COMMIT"]},
                  }],
              },
              "runDetails": {
                  "builder": {"id": "https://github.com/bartbaszt/mcpiler-engine/.github/workflows/release.yml@refs/heads/main"},
                  "metadata": {"invocationId": os.environ["INVOCATION_ID"]},
              },
          }
          with open("provenance.json", "w", encoding="utf-8", newline="\n") as stream:
              json.dump(data, stream, sort_keys=True, separators=(",", ":"))
              stream.write("\n")
          PY
          cosign sign --yes "$SUBJECT"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$SUBJECT"
          # The generated predicate is SLSA v1 (`buildDefinition`/`runDetails`). cosign's plain
          # `slsaprovenance` type means v0.2 and rejects that shape with "required field builder
          # missing"; `slsaprovenance1` selects the v1 statement type.
          cosign attest --yes --type slsaprovenance1 --predicate provenance.json "$SUBJECT"
          bash eng/verify-supply-chain.sh --subject "$SUBJECT"

  visibility:
    name: PACKAGE_VISIBILITY_REQUIRED / anonymous candidate check
    needs: [prepare, candidate_publish, supply_chain]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Require anonymous access before Git or stable publication
        env:
          CANDIDATE_REF: ${{ needs.candidate_publish.outputs.candidate_ref }}
        run: |
          set -euo pipefail
          if ! docker buildx imagetools inspect "$CANDIDATE_REF" >/dev/null 2>&1; then
            echo 'RESULT: PACKAGE_VISIBILITY_REQUIRED'
            echo 'The fully verified candidate exists but the package is not anonymously readable yet.' >&2
            exit 1
          fi
          echo 'RESULT: PUBLIC_CANDIDATE_VERIFIED'

  git_publish:
    name: GIT_PUBLISHED
    needs: [prepare, candidate_publish, visibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          path: source
      - name: Restore the exact prepared release commit into the authenticated checkout
        working-directory: source
        env:
          RELEASE_BUNDLE: ${{ needs.prepare.outputs.release_bundle }}
          RELEASE_BUNDLE_SHA256: ${{ needs.prepare.outputs.release_bundle_sha256 }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit }}
        run: |
          set -euo pipefail
          # The authenticated checkout stays on main; the verified release commit is only moved into
          # the working tree. Nothing pushes the prepared commit as a ref before eng/release.sh
          # --publish-git performs the atomic main+tag push.
          printf '%s\n' "$RELEASE_BUNDLE" | bash eng/release-bundle.sh restore --repo . --base64-stdin --sha256 "$RELEASE_BUNDLE_SHA256" --base-sha "$BASE_SHA" --release-commit "$RELEASE_COMMIT"
      - name: Publish main and annotated stable tag atomically after fresh race check
        working-directory: source
        env:
          MCPILER_ENGINE_RELEASE_WORKFLOW: 'true'
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: bash eng/release.sh --publish-git --base-sha "$BASE_SHA" --release-commit "$RELEASE_COMMIT" --tag "$RELEASE_TAG"

  stable_promote:
    name: STABLE_PROMOTED
    needs: [prepare, candidate_publish, git_publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - env:
          MCPILER_ENGINE_RELEASE_WORKFLOW: 'true'
          SOURCE: ${{ needs.candidate_publish.outputs.candidate_ref }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: bash eng/publish-release.sh --promote-stable --source "$SOURCE" --target-tag "$RELEASE_TAG"

  latest_promote:
    name: LATEST_PROMOTED
    needs: [prepare, candidate_publish, stable_promote]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote stable candidate to latest without rebuild and compare raw indexes
        env:
          MCPILER_ENGINE_RELEASE_WORKFLOW: 'true'
          SOURCE: ${{ needs.candidate_publish.outputs.candidate_ref }}
          STABLE: ghcr.io/bartbaszt/mcpiler-engine:${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          bash eng/publish-release.sh --promote-latest --source "$SOURCE"
          bash eng/verify-container.sh --compare-index "$SOURCE" "$STABLE" ghcr.io/bartbaszt/mcpiler-engine:latest

  github_release:
    name: GITHUB_RELEASE_PUBLISHED / COMPLETE
    needs: [prepare, latest_promote]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Publish GitHub Release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail
          source eng/release-lib.sh
          changelog_section CHANGELOG.md "$RELEASE_VERSION" > release-body.md
           if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
             [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]]
             [[ "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" != true ]]
             gh release view "$RELEASE_TAG" --json body --jq .body > existing-release-body.md
             cmp -s release-body.md existing-release-body.md
             echo 'RESULT: GITHUB_RELEASE_ALREADY_PUBLISHED'
           else
             gh release create "$RELEASE_TAG" --verify-tag --title "MCPiler Engine $RELEASE_TAG" --notes-file release-body.md
             echo 'RESULT: GITHUB_RELEASE_PUBLISHED'
           fi
