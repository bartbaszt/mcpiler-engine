name: Resume stable release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vA.B.C tag for a post-Git-publish resume. Leave empty for first-public visibility resume.
        required: false
        type: string
      release_run_id:
        description: Failed release workflow run ID whose prepare job log carries the first-public release bundle.
        required: false
        type: string

concurrency:
  group: engine-stable-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      release_commit: ${{ steps.resolve.outputs.release_commit }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      candidate_ref: ${{ steps.resolve.outputs.candidate_ref }}
      mode: ${{ steps.resolve.outputs.mode }}
      release_bundle: ${{ steps.resolve.outputs.release_bundle }}
      release_bundle_sha256: ${{ steps.resolve.outputs.release_bundle_sha256 }}
    steps:
      - name: Validate resume selector
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG_INPUT" && -n "$RELEASE_RUN_ID" ]] || [[ -z "$RELEASE_TAG_INPUT" && -z "$RELEASE_RUN_ID" ]]; then
            echo 'Provide exactly one of release_tag or release_run_id.' >&2
            exit 64
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: ${{ inputs.release_run_id != '' }}
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Validate the failed release run
        if: ${{ inputs.release_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'FAIL: release_run_id must be a numeric workflow run ID.' >&2; exit 64; }
          # A resume must never trust an arbitrary run ID: only a stable release entry workflow,
          # dispatched manually from this repository's own main branch, may supply a prepared commit.
          run_identity="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" --jq '[.path, .event, .head_branch, (.head_repository.full_name // "")] | @tsv')"
          IFS=$'\t' read -r workflow_path run_event head_branch head_repository <<<"$run_identity"
          case "$workflow_path" in
            .github/workflows/release-patch.yml|.github/workflows/release-minor.yml|.github/workflows/release-major.yml) ;;
            *) echo "FAIL: run $RUN_ID was not started by a stable release entry workflow (path: ${workflow_path:-<none>})." >&2; exit 1 ;;
          esac
          [[ "$run_event" == 'workflow_dispatch' ]] || { echo "FAIL: run $RUN_ID was not dispatched manually (event: ${run_event:-<none>})." >&2; exit 1; }
          [[ "$head_branch" == 'main' ]] || { echo "FAIL: run $RUN_ID was not dispatched from main (branch: ${head_branch:-<none>})." >&2; exit 1; }
          [[ "$head_repository" == "$REPOSITORY" ]] || { echo "FAIL: run $RUN_ID belongs to repository ${head_repository:-<none>}, not $REPOSITORY." >&2; exit 1; }
          echo "RESULT: RELEASE_RUN_VALIDATED path=$workflow_path event=$run_event branch=$head_branch"
      - name: Collect the prepare job logs newest first
        if: ${{ inputs.release_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -euo pipefail
          # `filter=all` is required: a re-run attempt whose prepare job failed early must not hide a
          # valid block produced by an earlier attempt of the same run.
          gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?filter=all&per_page=100" \
            --jq '.jobs[] | select(.name | endswith("METADATA_PREPARED / RELEASE_COMMITTED")) | [(.started_at // ""), (.id | tostring)] | @tsv' \
            > prepare-jobs-raw.tsv
          sed '/^[[:space:]]*$/d' prepare-jobs-raw.tsv | sort -t$'\t' -k1,1r -k2,2nr > prepare-jobs.tsv
          [[ -s prepare-jobs.tsv ]] || { echo "FAIL: run $RUN_ID has no prepare job." >&2; exit 1; }
          : > prepare-log-manifest.tsv
          while IFS=$'\t' read -r started_at job_id; do
            [[ "$job_id" =~ ^[0-9]+$ ]] || { echo "FAIL: prepare job id '$job_id' is not numeric." >&2; exit 1; }
            log="prepare-${job_id}.log"
            # gh api refuses job logs that contain terminal escape sequences (every log has ANSI in
            # its echoed `run:` headers) unless --allow-escape-sequences is passed, and the runner's
            # preinstalled gh version is not pinned. curl follows the redirect to the signed blob URL
            # and drops the Authorization header on the cross-host hop; do not use --location-trusted.
            if ! curl --fail --silent --show-error --location --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${job_id}/logs" \
              -o "$log"; then
              echo "Prepare job $job_id log download failed; treating it as an invalid candidate." >&2
              : > "$log"
            elif [[ ! -s "$log" ]]; then
              echo "Prepare job $job_id returned an empty log; treating it as an invalid candidate." >&2
            fi
            printf '%s\t%s\t%s\n' "$started_at" "$job_id" "$log" >> prepare-log-manifest.tsv
          done < prepare-jobs.tsv
          echo "RESULT: PREPARE_LOGS_COLLECTED count=$(wc -l < prepare-log-manifest.tsv | tr -d '[:space:]')"
      - name: Restore the first-public release bundle from the prepare logs
        id: visibility
        if: ${{ inputs.release_run_id != '' }}
        run: |
          set -euo pipefail
          # The failed run's artifacts and job outputs are gone, so its prepare job logs are the only
          # carrier of the prepared commit. The helper tries every candidate newest first and accepts
          # only a log with exactly one well-formed block whose SHA-256 and release commit both match.
          output="$(bash source/eng/release-bundle.sh extract-best-block --repo source --input prepare-log-manifest.tsv --bundle release.bundle)"
          printf '%s\n' "$output"
          release_commit="$(printf '%s\n' "$output" | sed -n 's/^RELEASE_COMMIT=//p')"
          bundle_sha="$(printf '%s\n' "$output" | sed -n 's/^RELEASE_BUNDLE_SHA256=//p')"
          bundle_base="$(printf '%s\n' "$output" | sed -n 's/^RELEASE_BASE_SHA=//p')"
          origin_main="$(git -C source rev-parse --verify --quiet 'origin/main^{commit}')" || {
            echo 'FAIL: the release checkout has no origin/main to compare the prepared base against.' >&2
            exit 1
          }
          # eng/release.sh --publish-git refuses any base that is not live origin/main, so a resume
          # must reject that mismatch before it verifies or publishes a candidate.
          [[ "$bundle_base" == "$origin_main" ]] || {
            echo "FAIL: prepared release base $bundle_base is not current origin/main $origin_main." >&2
            exit 1
          }
          bash source/eng/release-bundle.sh restore --repo source --bundle release.bundle --sha256 "$bundle_sha" --base-sha "$bundle_base" --release-commit "$release_commit"
          [[ "$(git -C source rev-parse HEAD)" == "$release_commit" ]] || { echo 'FAIL: restored checkout is not the prepared release commit.' >&2; exit 1; }
          base_sha="$(git -C source rev-parse HEAD^)"
          [[ "$base_sha" == "$origin_main" ]] || { echo "FAIL: restored release base $base_sha is not current origin/main $origin_main." >&2; exit 1; }
          version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' source/src/MCPiler.Engine.Host/MCPiler.Engine.Host.csproj | head -n1)"
          tag="v$version"
          printf 'mode=visibility\nrelease_tag=%s\nrelease_version=%s\nrelease_commit=%s\nbase_sha=%s\ncandidate_ref=ghcr.io/bartbaszt/mcpiler-engine:%s\nrelease_bundle_sha256=%s\n' "$tag" "$version" "$release_commit" "$base_sha" "$release_commit" "$bundle_sha" >>"$GITHUB_OUTPUT"
          bundle_base64="$(bash source/eng/release-bundle.sh encode --bundle release.bundle)"
          printf 'release_bundle=%s\n' "$bundle_base64" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: ${{ inputs.release_tag != '' }}
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Resolve post-Git identity
        id: postgit
        if: ${{ inputs.release_tag != '' }}
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 64
          release_commit="$(git -C source rev-parse HEAD)"
          base_sha="$(git -C source rev-parse HEAD^)"
          version="${RELEASE_TAG_INPUT#v}"
          printf 'mode=postgit\nrelease_tag=%s\nrelease_version=%s\nrelease_commit=%s\nbase_sha=%s\ncandidate_ref=ghcr.io/bartbaszt/mcpiler-engine:%s\n' "$RELEASE_TAG_INPUT" "$version" "$release_commit" "$base_sha" "$release_commit" >>"$GITHUB_OUTPUT"
      - name: Publish resolved outputs
        id: resolve
        env:
          VIS_MODE: ${{ steps.visibility.outputs.mode }}
          VIS_TAG: ${{ steps.visibility.outputs.release_tag }}
          VIS_VERSION: ${{ steps.visibility.outputs.release_version }}
          VIS_COMMIT: ${{ steps.visibility.outputs.release_commit }}
          VIS_BASE: ${{ steps.visibility.outputs.base_sha }}
          VIS_CANDIDATE: ${{ steps.visibility.outputs.candidate_ref }}
          VIS_BUNDLE: ${{ steps.visibility.outputs.release_bundle }}
          VIS_BUNDLE_SHA: ${{ steps.visibility.outputs.release_bundle_sha256 }}
          POST_MODE: ${{ steps.postgit.outputs.mode }}
          POST_TAG: ${{ steps.postgit.outputs.release_tag }}
          POST_VERSION: ${{ steps.postgit.outputs.release_version }}
          POST_COMMIT: ${{ steps.postgit.outputs.release_commit }}
          POST_BASE: ${{ steps.postgit.outputs.base_sha }}
          POST_CANDIDATE: ${{ steps.postgit.outputs.candidate_ref }}
        run: |
          set -euo pipefail
          # The bundle outputs are only meaningful for the visibility mode; the post-Git mode resolves
          # its source from the immutable tag and leaves them empty.
          if [[ -n "$VIS_MODE" ]]; then
            printf 'mode=%s\nrelease_tag=%s\nrelease_version=%s\nrelease_commit=%s\nbase_sha=%s\ncandidate_ref=%s\n' "$VIS_MODE" "$VIS_TAG" "$VIS_VERSION" "$VIS_COMMIT" "$VIS_BASE" "$VIS_CANDIDATE" >>"$GITHUB_OUTPUT"
            printf 'release_bundle=%s\nrelease_bundle_sha256=%s\n' "$VIS_BUNDLE" "$VIS_BUNDLE_SHA" >>"$GITHUB_OUTPUT"
          else
            printf 'mode=%s\nrelease_tag=%s\nrelease_version=%s\nrelease_commit=%s\nbase_sha=%s\ncandidate_ref=%s\n' "$POST_MODE" "$POST_TAG" "$POST_VERSION" "$POST_COMMIT" "$POST_BASE" "$POST_CANDIDATE" >>"$GITHUB_OUTPUT"
            printf 'release_bundle=\nrelease_bundle_sha256=\n' >>"$GITHUB_OUTPUT"
          fi

  verify_candidate:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: ${{ needs.resolve.outputs.mode == 'visibility' }}
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Restore first-public release source
        if: ${{ needs.resolve.outputs.mode == 'visibility' }}
        working-directory: source
        env:
          RELEASE_BUNDLE: ${{ needs.resolve.outputs.release_bundle }}
          RELEASE_BUNDLE_SHA256: ${{ needs.resolve.outputs.release_bundle_sha256 }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.release_commit }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_BUNDLE" | bash eng/release-bundle.sh restore --repo . --base64-stdin --sha256 "$RELEASE_BUNDLE_SHA256" --base-sha "$BASE_SHA" --release-commit "$RELEASE_COMMIT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: ${{ needs.resolve.outputs.mode == 'postgit' }}
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with:
          cosign-release: v2.6.0
      - name: Prove candidate is anonymously readable and supply-chain complete
        env:
          CANDIDATE_REF: ${{ needs.resolve.outputs.candidate_ref }}
        run: |
          set -euo pipefail
          raw="$(docker buildx imagetools inspect --raw "$CANDIDATE_REF")"
          digest="$(docker buildx imagetools inspect "$CANDIDATE_REF" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ -n "$raw" && "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          bash source/eng/verify-supply-chain.sh --subject "ghcr.io/bartbaszt/mcpiler-engine@$digest"

  git_publish:
    if: ${{ needs.resolve.outputs.mode == 'visibility' }}
    needs: [resolve, verify_candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          path: source
      - name: Restore the exact first-public release commit into the authenticated checkout
        working-directory: source
        env:
          RELEASE_BUNDLE: ${{ needs.resolve.outputs.release_bundle }}
          RELEASE_BUNDLE_SHA256: ${{ needs.resolve.outputs.release_bundle_sha256 }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.release_commit }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_BUNDLE" | bash eng/release-bundle.sh restore --repo . --base64-stdin --sha256 "$RELEASE_BUNDLE_SHA256" --base-sha "$BASE_SHA" --release-commit "$RELEASE_COMMIT"
      - name: Validate first-public resume and publish Git refs
        working-directory: source
        env:
          MCPILER_ENGINE_RELEASE_WORKFLOW: 'true'
          RELEASE_COMMIT: ${{ needs.resolve.outputs.release_commit }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
        run: |
          set -euo pipefail
          bash eng/release.sh --resume-visibility --release-commit "$RELEASE_COMMIT" --candidate-commit "$RELEASE_COMMIT" --tag "$RELEASE_TAG"
          bash eng/release.sh --publish-git --base-sha "$BASE_SHA" --release-commit "$RELEASE_COMMIT" --tag "$RELEASE_TAG"

  resume_guard:
    if: ${{ needs.resolve.outputs.mode == 'postgit' }}
    needs: [resolve, verify_candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: true
      - env:
          RELEASE_COMMIT: ${{ needs.resolve.outputs.release_commit }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: bash eng/release.sh --resume --release-commit "$RELEASE_COMMIT" --candidate-commit "$RELEASE_COMMIT" --tag "$RELEASE_TAG"

  stable_promote:
    needs: [resolve, verify_candidate, git_publish, resume_guard]
    if: ${{ always() && needs.verify_candidate.result == 'success' && (needs.git_publish.result == 'success' || needs.git_publish.result == 'skipped') && (needs.resume_guard.result == 'success' || needs.resume_guard.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - env:
          MCPILER_ENGINE_RELEASE_WORKFLOW: 'true'
          SOURCE: ${{ needs.resolve.outputs.candidate_ref }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: bash eng/publish-release.sh --promote-stable --source "$SOURCE" --target-tag "$RELEASE_TAG"

  latest_promote:
    needs: [resolve, stable_promote]
    # The two resume modes are mutually exclusive, so exactly one branch job is always skipped and a skip
    # taints every later job in the dependency chain. Each tail job therefore declares its own accepting
    # form; a bare `needs:` would be silently skipped while the run still reported success.
    if: ${{ always() && needs.resolve.result == 'success' && needs.stable_promote.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - env:
          MCPILER_ENGINE_RELEASE_WORKFLOW: 'true'
          SOURCE: ${{ needs.resolve.outputs.candidate_ref }}
          STABLE: ghcr.io/bartbaszt/mcpiler-engine:${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          bash eng/publish-release.sh --promote-latest --source "$SOURCE"
          bash eng/verify-container.sh --compare-index "$SOURCE" "$STABLE" ghcr.io/bartbaszt/mcpiler-engine:latest

  github_release:
    needs: [resolve, latest_promote]
    # Same accepting form as the other tail job: resume must be able to repair a missing GitHub Release
    # even though the unrelated sibling branch was skipped.
    if: ${{ always() && needs.resolve.result == 'success' && needs.latest_promote.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
        run: |
          set -euo pipefail
          source eng/release-lib.sh
          changelog_section CHANGELOG.md "$RELEASE_VERSION" > release-body.md
           if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
             [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]]
             [[ "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" != true ]]
             gh release view "$RELEASE_TAG" --json body --jq .body > existing-release-body.md
             cmp -s release-body.md existing-release-body.md
             echo 'RESULT: GITHUB_RELEASE_ALREADY_PUBLISHED'
           else
             gh release create "$RELEASE_TAG" --verify-tag --title "MCPiler Engine $RELEASE_TAG" --notes-file release-body.md
             echo 'RESULT: GITHUB_RELEASE_PUBLISHED'
           fi

  resume_complete:
    # Terminal completeness gate. A skipped job taints the downstream chain, so without an explicit
    # assertion a resume could leave the run green while the artifacts it exists to repair are still
    # missing. This job always runs and fails the workflow unless every required resume stage either
    # succeeded or was the mode-exclusive sibling of the stage that did.
    if: ${{ always() }}
    needs: [resolve, verify_candidate, git_publish, resume_guard, stable_promote, latest_promote, github_release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse success when a required resume stage did not run
        env:
          RESOLVE: ${{ needs.resolve.result }}
          VERIFY_CANDIDATE: ${{ needs.verify_candidate.result }}
          GIT_PUBLISH: ${{ needs.git_publish.result }}
          RESUME_GUARD: ${{ needs.resume_guard.result }}
          STABLE_PROMOTE: ${{ needs.stable_promote.result }}
          LATEST_PROMOTE: ${{ needs.latest_promote.result }}
          GITHUB_RELEASE: ${{ needs.github_release.result }}
        run: |
          set -euo pipefail
          failed=0

          for stage in \
            "resolve=$RESOLVE" \
            "verify_candidate=$VERIFY_CANDIDATE" \
            "stable_promote=$STABLE_PROMOTE" \
            "latest_promote=$LATEST_PROMOTE" \
            "github_release=$GITHUB_RELEASE"
          do
            name="${stage%%=*}"
            result="${stage#*=}"
            if [[ "$result" != 'success' ]]; then
              echo "FAIL: resume stage '$name' did not succeed (result: $result)." >&2
              failed=1
            fi
          done

          # The two publication modes are mutually exclusive: exactly one of these must have run.
          mode_successes=0
          [[ "$GIT_PUBLISH" == 'success' ]] && mode_successes=$((mode_successes + 1))
          [[ "$RESUME_GUARD" == 'success' ]] && mode_successes=$((mode_successes + 1))
          if [[ "$mode_successes" -ne 1 ]]; then
            echo "FAIL: expected exactly one of git_publish/resume_guard to succeed, got $mode_successes." >&2
            failed=1
          fi

          ((failed == 0)) || { echo 'RESULT: RESUME_INCOMPLETE'; exit 1; }
          echo 'RESULT: RESUME_COMPLETE'
